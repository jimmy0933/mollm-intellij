name: Build Plugin

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract IntelliJ minimum build
        id: min_build
        run: |
          MIN_BUILD=$(grep -oP 'since-build="\K[^"]+' src/main/resources/META-INF/plugin.xml | head -n 1)
          echo "MIN_BUILD=$MIN_BUILD" >> $GITHUB_ENV
          echo "min_build=$MIN_BUILD" >> $GITHUB_OUTPUT

      - name: Setup IntelliJ Platform IDE
        id: setup-ide
        uses: JetBrains/intellij-platform-installation-action@v1.1
        with:
          ide: IntelliJ IDEA Community Edition
          version: ${{ env.MIN_BUILD }}

      - name: Build Plugin
        run: ./gradlew clean check buildPlugin -PideaHome=${{ steps.setup-ide.outputs.idea-home }}

      - name: Generate Plugin ZIP Checksum
        run: |
          VERSION=$(grep -oP "^version = '\K[^']+" build.gradle)
          ZIP_NAME="mollm-intellij-${VERSION}.zip"
          cd build/distributions
          sha256sum ${ZIP_NAME} > ${ZIP_NAME}.sha256
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "SHA256=$(cat ${ZIP_NAME}.sha256)" >> $GITHUB_ENV
          echo "COMMIT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IDE_PATH=${{ steps.setup-ide.outputs.idea-home }}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mollm-intellij-${{ env.VERSION }}-${{ env.COMMIT_SHA }}
          path: |
            build/distributions/${{ env.ZIP_NAME }}
            build/distributions/${{ env.ZIP_NAME }}.sha256
          if-no-files-found: error

      - name: Write Job Summary
        run: |
          echo "## Build Successful! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ env.COMMIT_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- **JDK Version**: 21" >> $GITHUB_STEP_SUMMARY
          echo "- **IntelliJ SDK Version**: ${{ env.MIN_BUILD }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download and Install" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact ZIP below." >> $GITHUB_STEP_SUMMARY
          echo "2. Unzip it to find \`${{ env.ZIP_NAME }}\`." >> $GITHUB_STEP_SUMMARY
          echo "3. In IntelliJ IDEA, go to **Settings > Plugins > ⚙️ > Install Plugin from Disk...**" >> $GITHUB_STEP_SUMMARY
          echo "4. Select \`${{ env.ZIP_NAME }}\`." >> $GITHUB_STEP_SUMMARY

      - name: Create Pre-release
        if: github.ref == 'refs/heads/master' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          prerelease: true
          files: |
            build/distributions/${{ env.ZIP_NAME }}
            build/distributions/${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
